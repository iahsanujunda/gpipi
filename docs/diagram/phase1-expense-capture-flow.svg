<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title description">
  <title id="title">Phase 1 expense capture flow</title>
  <desc id="description">Flow diagram from a signed Slack app mention through extraction and a pending draft to atomic confirmation or rejection.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#334155" flood-opacity="0.2" /></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4A86E8" /></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #FFFFFF; font-size: 20px; font-weight: 700; }
      .lane { fill: #667085; font-size: 15px; font-weight: 700; letter-spacing: .7px; }
      .card-title { fill: #172033; font-size: 16px; font-weight: 700; }
      .body { fill: #667085; font-size: 13px; }
      .label { fill: #475467; font-size: 12px; font-weight: 700; }
      .card { fill: #FFFFFF; stroke: #C8CCD2; stroke-width: 1.4; filter: url(#shadow); }
      .flow { fill: none; stroke: #4A86E8; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 6; }
    </style>
  </defs>

  <rect width="1600" height="880" fill="#FFFFFF" />
  <rect x="14" y="14" width="1572" height="58" rx="2" fill="#4AA3E8" filter="url(#shadow)" />
  <text x="78" y="50" class="title">Flow: Phase 1 &gt; Human-reviewed expense capture</text>

  <rect x="52" y="112" width="1496" height="174" rx="4" fill="#F7F8FA" stroke="#D9DDE3" />
  <text x="76" y="141" class="lane">INGRESS · ACKNOWLEDGED BEFORE SLOW WORK</text>
  <rect x="52" y="318" width="1496" height="210" rx="4" fill="#F7F8FA" stroke="#D9DDE3" />
  <text x="76" y="347" class="lane">PROPOSAL · MODEL HAS NO WRITE AUTHORITY</text>
  <rect x="52" y="560" width="1496" height="250" rx="4" fill="#F7F8FA" stroke="#D9DDE3" />
  <text x="76" y="589" class="lane">DECISION · ONE DATABASE TRANSITION WINS</text>

  <!-- Ingress cards -->
  <g transform="translate(96 171)">
    <rect width="210" height="82" rx="3" class="card" />
    <circle cx="35" cy="41" r="21" fill="#4A154B" /><text x="35" y="47" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">1</text>
    <text x="69" y="34" class="card-title">Slack app mention</text>
    <text x="69" y="56" class="body">POST /slack/events</text>
  </g>
  <g transform="translate(382 171)">
    <rect width="230" height="82" rx="3" class="card" />
    <circle cx="35" cy="41" r="21" fill="#4A86E8" /><text x="35" y="47" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">2</text>
    <text x="69" y="34" class="card-title">Verify + acknowledge</text>
    <text x="69" y="56" class="body">Raw HMAC · return 200</text>
  </g>
  <g transform="translate(694 171)">
    <rect width="230" height="82" rx="3" class="card" />
    <circle cx="35" cy="41" r="21" fill="#5B8DEF" /><text x="35" y="47" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">3</text>
    <text x="69" y="34" class="card-title">Capture inbound row</text>
    <text x="69" y="56" class="body">Unique Slack event_id</text>
  </g>
  <g transform="translate(1006 171)">
    <polygon points="105,0 210,41 105,82 0,41" fill="#FFFFFF" stroke="#4A86E8" stroke-width="1.8" filter="url(#shadow)" />
    <text x="105" y="35" text-anchor="middle" class="card-title">New event?</text>
    <text x="105" y="56" text-anchor="middle" class="body">inserted row</text>
  </g>
  <g transform="translate(1300 171)">
    <rect width="196" height="82" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 5" />
    <text x="98" y="34" text-anchor="middle" class="card-title">Duplicate stops</text>
    <text x="98" y="56" text-anchor="middle" class="body">Original row unchanged</text>
  </g>

  <path d="M306 212h76" class="flow" /><path d="M612 212h82" class="flow" /><path d="M924 212h82" class="flow" />
  <path d="M1216 212h84" class="flow dashed" /><text x="1258" y="199" text-anchor="middle" class="label">NO</text>

  <!-- Proposal cards -->
  <g transform="translate(114 388)">
    <rect width="240" height="104" rx="3" class="card" />
    <circle cx="40" cy="44" r="22" fill="#5B8DEF" /><text x="40" y="50" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">4</text>
    <text x="78" y="33" class="card-title">Dispatch fallback</text>
    <text x="78" y="55" class="body">No command matched</text>
    <line x1="24" y1="74" x2="216" y2="74" stroke="#D7DAE0" />
    <text x="120" y="94" text-anchor="middle" class="body">LogExpenseCommand</text>
  </g>
  <g transform="translate(456 388)">
    <rect width="252" height="104" rx="3" class="card" />
    <circle cx="40" cy="44" r="22" fill="#8B5CF6" /><text x="40" y="50" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">5</text>
    <text x="78" y="33" class="card-title">Extract proposal</text>
    <text x="78" y="55" class="body">Live category snapshot</text>
    <line x1="24" y1="74" x2="228" y2="74" stroke="#D7DAE0" />
    <text x="126" y="94" text-anchor="middle" class="body">OpenRouter strict JSON</text>
  </g>
  <g transform="translate(810 388)">
    <rect width="252" height="104" rx="3" class="card" />
    <circle cx="40" cy="44" r="22" fill="#F59E0B" /><text x="40" y="50" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">6</text>
    <text x="78" y="33" class="card-title">Persist PENDING draft</text>
    <text x="78" y="55" class="body">Prediction + model audit</text>
    <line x1="24" y1="74" x2="228" y2="74" stroke="#D7DAE0" />
    <text x="126" y="94" text-anchor="middle" class="body">No expense exists yet</text>
  </g>
  <g transform="translate(1164 388)">
    <rect width="252" height="104" rx="3" class="card" />
    <circle cx="40" cy="44" r="22" fill="#4A154B" /><text x="40" y="50" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">7</text>
    <text x="78" y="33" class="card-title">Post review card</text>
    <text x="78" y="55" class="body">Editable category</text>
    <line x1="24" y1="74" x2="228" y2="74" stroke="#D7DAE0" />
    <text x="126" y="94" text-anchor="middle" class="body">Confirm · Not an expense</text>
  </g>
  <path d="M1216 253v49H234v86" class="flow" /><text x="725" y="295" text-anchor="middle" class="label">YES · process asynchronously</text>
  <path d="M354 440h102" class="flow" /><path d="M708 440h102" class="flow" /><path d="M1062 440h102" class="flow" />

  <!-- Decision -->
  <g transform="translate(102 634)">
    <rect width="230" height="108" rx="3" class="card" />
    <circle cx="40" cy="45" r="22" fill="#4A154B" /><text x="40" y="51" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700">8</text>
    <text x="78" y="34" class="card-title">Signed block action</text>
    <text x="78" y="56" class="body">ACK before parsing</text>
    <line x1="24" y1="78" x2="206" y2="78" stroke="#D7DAE0" />
    <text x="115" y="98" text-anchor="middle" class="body">Confirm or reject</text>
  </g>
  <g transform="translate(420 647)">
    <polygon points="108,0 216,42 108,84 0,42" fill="#FFFFFF" stroke="#4A86E8" stroke-width="1.8" filter="url(#shadow)" />
    <text x="108" y="36" text-anchor="middle" class="card-title">PENDING?</text>
    <text x="108" y="57" text-anchor="middle" class="body">conditional update</text>
  </g>
  <g transform="translate(744 620)">
    <rect width="290" height="132" rx="3" class="card" />
    <rect width="7" height="132" fill="#22A06B" />
    <text x="28" y="32" class="card-title">Confirm transaction</text>
    <text x="28" y="56" class="body">Draft → CONFIRMED</text>
    <text x="28" y="78" class="body">Insert expense + categorization_event</text>
    <text x="28" y="100" class="body">Inbound → RECORDED</text>
    <text x="28" y="121" class="label">COMMIT, THEN REPLACE CARD</text>
  </g>
  <g transform="translate(1104 620)">
    <rect width="290" height="132" rx="3" class="card" />
    <rect width="7" height="132" fill="#667085" />
    <text x="28" y="32" class="card-title">Reject transaction</text>
    <text x="28" y="56" class="body">Draft → CANCELLED</text>
    <text x="28" y="78" class="body">No expense or audit event</text>
    <text x="28" y="100" class="body">Inbound → NON_EXPENSE</text>
    <text x="28" y="121" class="label">COMMIT, THEN REPLACE CARD</text>
  </g>
  <g transform="translate(438 760)">
    <rect width="180" height="34" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4 5" />
    <text x="90" y="22" text-anchor="middle" class="body">Already consumed → no-op</text>
  </g>
  <path d="M1290 492v52H217v90" class="flow" />
  <path d="M332 688h88" class="flow" />
  <path d="M636 689h108" class="flow" /><text x="690" y="676" text-anchor="middle" class="label">CONFIRM</text>
  <path d="M636 689h272v-92h341v23" class="flow" /><text x="949" y="611" text-anchor="middle" class="label">REJECT</text>
  <path d="M528 731v29" class="flow dashed" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title description">
  <title id="title">Phase 1 lifecycle states</title>
  <desc id="description">State diagrams for inbound Slack messages and expense drafts, including terminal states, duplicate handling, and known recovery gaps.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#334155" flood-opacity="0.2" /></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4A86E8" /></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94A3B8" /></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #FFFFFF; font-size: 20px; font-weight: 700; }
      .lane { fill: #667085; font-size: 17px; font-weight: 700; }
      .state { fill: #172033; font-size: 16px; font-weight: 700; }
      .body { fill: #667085; font-size: 12px; }
      .label { fill: #475467; font-size: 12px; font-weight: 700; }
      .flow { fill: none; stroke: #4A86E8; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-muted { fill: none; stroke: #94A3B8; stroke-width: 1.8; stroke-dasharray: 5 5; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1600" height="930" fill="#FFFFFF" />
  <rect x="14" y="14" width="1572" height="58" rx="2" fill="#4AA3E8" filter="url(#shadow)" />
  <text x="78" y="50" class="title">Lifecycle: Phase 1 &gt; Inbound messages and expense drafts</text>

  <!-- Inbound lane -->
  <rect x="54" y="112" width="1492" height="470" rx="4" fill="#F7F8FA" stroke="#D9DDE3" />
  <text x="80" y="148" class="lane">inbound_message</text>
  <text x="235" y="148" class="body">One row per accepted Slack event ID</text>

  <g transform="translate(90 214)">
    <circle cx="34" cy="34" r="28" fill="#FFFFFF" stroke="#4A86E8" stroke-width="2" filter="url(#shadow)" />
    <circle cx="34" cy="34" r="10" fill="#4A86E8" />
    <text x="34" y="82" text-anchor="middle" class="body">new event</text>
  </g>
  <g transform="translate(226 188)">
    <rect width="220" height="88" rx="4" fill="#FFFFFF" stroke="#4A86E8" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="88" fill="#4A86E8" />
    <text x="113" y="37" text-anchor="middle" class="state">RECEIVED</text>
    <text x="113" y="60" text-anchor="middle" class="body">processing or awaiting review</text>
  </g>
  <path d="M152 248h74" class="flow" /><text x="189" y="236" text-anchor="middle" class="label">unique insert</text>

  <!-- Terminal inbound states -->
  <g transform="translate(570 176)">
    <rect width="220" height="82" rx="4" fill="#FFFFFF" stroke="#22A06B" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="82" fill="#22A06B" />
    <text x="113" y="35" text-anchor="middle" class="state">RECORDED</text>
    <text x="113" y="58" text-anchor="middle" class="body">confirmed expense committed</text>
  </g>
  <g transform="translate(570 282)">
    <rect width="220" height="82" rx="4" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="82" fill="#667085" />
    <text x="113" y="35" text-anchor="middle" class="state">NON_EXPENSE</text>
    <text x="113" y="58" text-anchor="middle" class="body">person rejected proposal</text>
  </g>
  <g transform="translate(570 388)">
    <rect width="220" height="82" rx="4" fill="#FFFFFF" stroke="#D64545" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="82" fill="#D64545" />
    <text x="113" y="35" text-anchor="middle" class="state">FAILED_PARSE</text>
    <text x="113" y="58" text-anchor="middle" class="body">expense extraction failed</text>
  </g>
  <g transform="translate(920 226)">
    <rect width="230" height="82" rx="4" fill="#FFFFFF" stroke="#5B8DEF" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="82" fill="#5B8DEF" />
    <text x="118" y="35" text-anchor="middle" class="state">COMMAND</text>
    <text x="118" y="58" text-anchor="middle" class="body">deterministic command completed</text>
  </g>
  <g transform="translate(920 350)">
    <rect width="230" height="82" rx="4" fill="#FFFFFF" stroke="#D64545" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="82" fill="#D64545" />
    <text x="118" y="35" text-anchor="middle" class="state">FAILED_COMMAND</text>
    <text x="118" y="58" text-anchor="middle" class="body">reason retained for diagnosis</text>
  </g>

  <path d="M446 210h70v7h54" class="flow" /><text x="508" y="200" text-anchor="middle" class="label">confirm</text>
  <path d="M446 240h70v83h54" class="flow" /><text x="523" y="311" class="label">reject</text>
  <path d="M336 276v153h234" class="flow" /><text x="435" y="417" text-anchor="middle" class="label">extraction error</text>
  <path d="M446 250h54v20h320v-3h100" class="flow" /><text x="850" y="247" text-anchor="middle" class="label">command completed</text>
  <path d="M446 258h374v133h100" class="flow" /><text x="862" y="379" text-anchor="middle" class="label">command failed</text>

  <!-- Duplicate and enum-only notes -->
  <g transform="translate(1250 176)">
    <rect width="244" height="108" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 5" />
    <text x="122" y="31" text-anchor="middle" class="state">Duplicate event_id</text>
    <text x="122" y="55" text-anchor="middle" class="body">No new row is created.</text>
    <text x="122" y="75" text-anchor="middle" class="body">The original row and status</text>
    <text x="122" y="93" text-anchor="middle" class="body">remain unchanged.</text>
  </g>
  <path d="M124 214v-50h1248v12" class="flow-muted" />
  <text x="756" y="158" text-anchor="middle" class="label">unique conflict</text>

  <g transform="translate(1250 326)">
    <rect width="244" height="94" rx="4" fill="#FFF8E7" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 5" />
    <text x="122" y="31" text-anchor="middle" class="state">SKIPPED</text>
    <text x="122" y="55" text-anchor="middle" class="body">Kotlin enum value only.</text>
    <text x="122" y="75" text-anchor="middle" class="body">No repository path writes it.</text>
  </g>
  <g transform="translate(1250 458)">
    <rect width="244" height="88" rx="4" fill="#FEECEC" stroke="#D64545" stroke-width="1.4" />
    <text x="122" y="29" text-anchor="middle" class="state">Known recovery gap</text>
    <text x="122" y="52" text-anchor="middle" class="body">RECEIVED can be abandoned</text>
    <text x="122" y="70" text-anchor="middle" class="body">after early ACK; no worker exists.</text>
  </g>
  <path d="M400 276v264h806v-38h44" class="flow-muted" />

  <!-- Draft lane -->
  <rect x="54" y="618" width="1492" height="254" rx="4" fill="#F7F8FA" stroke="#D9DDE3" />
  <text x="80" y="654" class="lane">expense_draft</text>
  <text x="224" y="654" class="body">Conditional state transition makes repeated or competing actions safe</text>

  <g transform="translate(116 703)">
    <rect width="250" height="94" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="94" fill="#F59E0B" />
    <text x="128" y="39" text-anchor="middle" class="state">PENDING</text>
    <text x="128" y="63" text-anchor="middle" class="body">card posted · awaiting decision</text>
  </g>
  <g transform="translate(644 682)">
    <rect width="252" height="94" rx="4" fill="#FFFFFF" stroke="#22A06B" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="94" fill="#22A06B" />
    <text x="130" y="39" text-anchor="middle" class="state">CONFIRMED</text>
    <text x="130" y="63" text-anchor="middle" class="body">expense + audit event written</text>
  </g>
  <g transform="translate(644 792)">
    <rect width="252" height="62" rx="4" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)" />
    <rect width="7" height="62" fill="#667085" />
    <text x="130" y="38" text-anchor="middle" class="state">CANCELLED</text>
  </g>
  <g transform="translate(1068 724)">
    <rect width="300" height="78" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 5" />
    <text x="150" y="31" text-anchor="middle" class="state">Repeated / losing action</text>
    <text x="150" y="54" text-anchor="middle" class="body">UPDATE matches nothing → no-op</text>
  </g>

  <path d="M366 735h278" class="flow" /><text x="505" y="721" text-anchor="middle" class="label">confirm wins</text>
  <path d="M366 764h170v59h108" class="flow" /><text x="507" y="811" text-anchor="middle" class="label">reject wins</text>
  <path d="M896 729h172" class="flow-muted" /><path d="M896 823h86v-60h86" class="flow-muted" />

  <rect x="54" y="892" width="1492" height="24" rx="3" fill="#EAF2FE" />
  <text x="800" y="909" text-anchor="middle" class="body">Terminal database state is authoritative; Slack card replacement happens after commit and may fail independently.</text>
</svg>

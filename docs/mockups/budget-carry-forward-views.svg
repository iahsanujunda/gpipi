<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1780" viewBox="0 0 1320 1780" role="img" aria-labelledby="title description">
  <title id="title">Household Assistant manual budget carry-forward mockups</title>
  <desc id="description">A mobile-first storyboard with no duplicate app header, showing previous-period carry-forward as one quiet action that opens a concise confirmation drawer and disappears after application.</desc>

  <defs>
    <filter id="phone-shadow" x="-20%" y="-10%" width="140%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D4E89" flood-opacity="0.18" />
    </filter>
    <filter id="panel-shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1D4E89" flood-opacity="0.13" />
    </filter>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .board-label { fill: #1D4E89; font-size: 13px; font-weight: 750; letter-spacing: 1.3px; }
      .heading { fill: #1D4E89; font-weight: 700; }
      .body { fill: #17312E; }
      .secondary { fill: #526966; }
      .eyebrow { fill: #526966; font-size: 9px; font-weight: 750; letter-spacing: 0.8px; }
      .money { fill: #1D4E89; font-weight: 720; font-variant-numeric: tabular-nums; }
      .button { font-size: 11px; font-weight: 720; }
      .danger { fill: #B42318; }
    </style>

    <g id="phone-shell">
      <rect width="390" height="760" rx="48" fill="#1D4E89" filter="url(#phone-shadow)" />
      <rect x="8" y="8" width="374" height="744" rx="40" fill="#F4FAFB" />
      <rect x="8" y="8" width="374" height="32" rx="40" fill="#FFFFFF" />
      <rect x="8" y="28" width="374" height="12" fill="#FFFFFF" />
      <text x="27" y="29" fill="#1D4E89" font-size="11" font-weight="700">9:41</text>
      <g fill="none" stroke="#1D4E89" stroke-width="1.5" stroke-linecap="round">
        <path d="M329 25c4-5 9-5 13 0" />
        <path d="M332 28c2-3 5-3 7 0" />
        <rect x="350" y="20" width="18" height="10" rx="2" />
      </g>
      <rect x="352.5" y="22.5" width="12.5" height="5" rx="1" fill="#1D4E89" />
      <rect x="146" y="14" width="98" height="20" rx="10" fill="#1D4E89" />
    </g>

    <g id="nav-dock">
      <rect x="8" y="688" width="374" height="64" fill="#F4FAFB" fill-opacity="0.97" />
      <circle cx="195" cy="718" r="25" fill="#16679A" />
      <rect x="185" y="708" width="8" height="8" rx="2" fill="#3FC1C0" />
      <rect x="197" y="708" width="8" height="8" rx="2" fill="#FFFFFF" />
      <rect x="185" y="720" width="8" height="8" rx="2" fill="#FFFFFF" />
      <rect x="197" y="720" width="8" height="8" rx="2" fill="#3FC1C0" />
    </g>

    <g id="edit-icon">
      <rect width="36" height="36" rx="10" fill="#FFFFFF" stroke="#C9E2E5" />
      <path d="m11 25 2-8L24 6l6 6-11 11-8 2Z" fill="none" stroke="#16679A" stroke-width="1.6" stroke-linejoin="round" />
    </g>

    <g id="previous-button">
      <rect width="44" height="44" rx="10" fill="#FFFFFF" stroke="#C9E2E5" />
      <path d="m25 14-8 8 8 8" fill="none" stroke="#16679A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g id="next-button-disabled">
      <rect width="44" height="44" rx="10" fill="#EDF3F4" stroke="#D9E5E7" />
      <path d="m19 14 8 8-8 8" fill="none" stroke="#9CAFAF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g id="current-period-header">
      <text x="24" y="85" class="heading" font-size="28">Budgeting</text>
      <text x="24" y="126" class="heading" font-size="15">Weekly</text>
      <text x="81" y="126" class="secondary" font-size="10.5">1 line</text>
      <use href="#previous-button" x="188" y="99" />
      <rect x="236" y="99" width="82" height="44" rx="10" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="277" y="117" class="eyebrow" text-anchor="middle">THIS WEEK</text>
      <text x="277" y="133" class="heading" font-size="11" text-anchor="middle">27 JUL–2 AUG</text>
      <use href="#next-button-disabled" x="322" y="99" />
    </g>
  </defs>

  <rect width="1320" height="1780" fill="#E7F5F7" />
  <text x="48" y="54" fill="#1D4E89" font-size="30" font-weight="750">Manual carry-forward · a quiet action, not the main attraction</text>
  <text x="48" y="84" fill="#526966" font-size="15">The bottom launcher identifies the app; budget content starts immediately below the system status area.</text>

  <g transform="translate(48 105)">
    <rect width="196" height="28" rx="14" fill="#DFF4F4" />
    <text x="98" y="19" fill="#16679A" font-size="11" font-weight="700" text-anchor="middle">NO AUTOMATIC ROLLOVER</text>
    <rect x="208" width="174" height="28" rx="14" fill="#FFFFFF" stroke="#C9E2E5" />
    <text x="295" y="19" fill="#526966" font-size="11" font-weight="700" text-anchor="middle">ONE COMPACT ACTION</text>
    <rect x="394" width="230" height="28" rx="14" fill="#FFFFFF" stroke="#3FC1C0" />
    <text x="509" y="19" fill="#16679A" font-size="11" font-weight="700" text-anchor="middle">ACTION DISAPPEARS AFTER APPLY</text>
  </g>

  <text class="board-label" x="230" y="174" text-anchor="middle">01 · AVAILABLE · ONE QUIET ACTION</text>
  <text class="board-label" x="660" y="174" text-anchor="middle">02 · CONFIRM · ESSENTIALS ONLY</text>
  <text class="board-label" x="1090" y="174" text-anchor="middle">03 · APPLIED · ACTION GONE</text>

  <!-- Phone 1: current period with one compact carry action -->
  <g transform="translate(35 200)">
    <use href="#phone-shell" />
    <use href="#current-period-header" />

    <g transform="translate(24 159)">
      <rect width="342" height="288" rx="14" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="18" y="31" class="heading" font-size="17">Eating Out</text>
      <use href="#edit-icon" x="288" y="13" />
      <text x="18" y="54" class="secondary" font-size="11">Restaurants, cafes, and takeout</text>
      <rect x="18" y="68" width="118" height="24" rx="12" fill="#DFF4F4" />
      <text x="77" y="84" class="secondary" font-size="9" font-weight="700" text-anchor="middle">WEEKLY · 27 JUL–2 AUG</text>
      <text x="18" y="119" class="eyebrow">SPENT</text>
      <text x="324" y="119" class="eyebrow" text-anchor="end">REMAINING</text>
      <text x="18" y="143" class="money" font-size="18">¥2,100</text>
      <text x="324" y="143" class="money" font-size="18" text-anchor="end">¥12,900 left</text>
      <rect x="18" y="158" width="306" height="9" rx="4.5" fill="#DFF4F4" />
      <rect x="18" y="158" width="43" height="9" rx="4.5" fill="#16679A" />
      <text x="18" y="187" class="secondary" font-size="10">Base cap ¥15,000</text>
      <text x="324" y="187" class="secondary" font-size="10" font-weight="700" text-anchor="end">14%</text>

      <rect x="18" y="211" width="306" height="48" rx="11" fill="#FFFFFF" stroke="#16679A" />
      <text x="171" y="240" fill="#16679A" class="button" text-anchor="middle">Add ¥3,000 from last week</text>
    </g>
    <use href="#nav-dock" />
  </g>

  <!-- Phone 2: concise confirmation drawer -->
  <g transform="translate(465 200)">
    <use href="#phone-shell" />
    <use href="#current-period-header" />
    <g transform="translate(24 159)">
      <rect width="342" height="288" rx="14" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="18" y="31" class="heading" font-size="17">Eating Out</text>
      <text x="18" y="54" class="secondary" font-size="11">Restaurants, cafes, and takeout</text>
      <rect x="18" y="68" width="118" height="24" rx="12" fill="#DFF4F4" />
      <text x="77" y="84" class="secondary" font-size="9" font-weight="700" text-anchor="middle">WEEKLY · 27 JUL–2 AUG</text>
      <text x="18" y="119" class="eyebrow">SPENT</text>
      <text x="324" y="119" class="eyebrow" text-anchor="end">REMAINING</text>
      <text x="18" y="143" class="money" font-size="18">¥2,100</text>
      <text x="324" y="143" class="money" font-size="18" text-anchor="end">¥12,900 left</text>
      <rect x="18" y="158" width="306" height="9" rx="4.5" fill="#DFF4F4" />
      <rect x="18" y="158" width="43" height="9" rx="4.5" fill="#16679A" />
      <text x="18" y="187" class="secondary" font-size="10">Base cap ¥15,000</text>
      <text x="324" y="187" class="secondary" font-size="10" font-weight="700" text-anchor="end">14%</text>

      <rect x="18" y="211" width="306" height="48" rx="11" fill="#FFFFFF" stroke="#16679A" />
      <text x="171" y="240" fill="#16679A" class="button" text-anchor="middle">Add ¥3,000 from last week</text>
    </g>

    <rect x="8" y="40" width="374" height="712" fill="#17312E" fill-opacity="0.48" />
    <g transform="translate(8 392)">
      <rect width="374" height="360" rx="28" fill="#FFFFFF" filter="url(#panel-shadow)" />
      <rect x="159" y="12" width="56" height="5" rx="2.5" fill="#C9E2E5" />
      <text x="24" y="54" class="heading" font-size="20">Add ¥3,000?</text>
      <text x="24" y="77" class="secondary" font-size="11">Eating Out · 27 Jul–2 Aug</text>

      <rect x="24" y="98" width="326" height="62" rx="12" fill="#F4FAFB" stroke="#C9E2E5" />
      <text x="40" y="121" class="eyebrow">LAST WEEK · 20–26 JUL</text>
      <text x="40" y="145" class="secondary" font-size="11">¥12,000 spent of ¥15,000</text>
      <text x="334" y="145" class="money" font-size="15" text-anchor="end">+¥3,000</text>

      <text x="24" y="194" class="secondary" font-size="11">Current allowance</text>
      <text x="334" y="194" class="money" font-size="13" text-anchor="end">¥15,000</text>
      <text x="24" y="222" class="secondary" font-size="11">From last week</text>
      <text x="334" y="222" fill="#16679A" font-size="13" font-weight="720" text-anchor="end">+¥3,000</text>
      <line x1="24" y1="239" x2="350" y2="239" stroke="#C9E2E5" />
      <text x="24" y="267" class="heading" font-size="13">New allowance</text>
      <text x="334" y="267" class="money" font-size="18" text-anchor="end">¥18,000</text>

      <rect x="24" y="288" width="104" height="48" rx="11" fill="#FFFFFF" stroke="#16679A" />
      <text x="76" y="317" fill="#16679A" class="button" text-anchor="middle">Back</text>
      <rect x="140" y="288" width="210" height="48" rx="11" fill="#16679A" />
      <text x="245" y="317" fill="#FFFFFF" class="button" text-anchor="middle">Add ¥3,000</text>
    </g>
  </g>

  <!-- Phone 3: applied state -->
  <g transform="translate(895 200)">
    <use href="#phone-shell" />
    <use href="#current-period-header" />

    <g transform="translate(24 159)">
      <rect width="342" height="230" rx="14" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="18" y="31" class="heading" font-size="17">Eating Out</text>
      <use href="#edit-icon" x="288" y="13" />
      <text x="18" y="54" class="secondary" font-size="11">Restaurants, cafes, and takeout</text>
      <rect x="18" y="68" width="118" height="24" rx="12" fill="#DFF4F4" />
      <text x="77" y="84" class="secondary" font-size="9" font-weight="700" text-anchor="middle">WEEKLY · 27 JUL–2 AUG</text>
      <text x="18" y="123" class="eyebrow">SPENT</text>
      <text x="324" y="123" class="eyebrow" text-anchor="end">REMAINING</text>
      <text x="18" y="147" class="money" font-size="18">¥2,100</text>
      <text x="324" y="147" class="money" font-size="18" text-anchor="end">¥15,900 left</text>
      <rect x="18" y="162" width="306" height="9" rx="4.5" fill="#DFF4F4" />
      <rect x="18" y="162" width="36" height="9" rx="4.5" fill="#16679A" />
      <text x="18" y="191" class="secondary" font-size="10">Allowance ¥18,000 · includes +¥3,000 from last week</text>
      <text x="324" y="191" class="secondary" font-size="10" font-weight="700" text-anchor="end">12%</text>
    </g>

    <rect x="24" y="413" width="342" height="44" rx="12" fill="#DFF4F4" stroke="#3FC1C0" />
    <path d="m42 433 5 5 10-12" fill="none" stroke="#16679A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="440" fill="#16679A" font-size="11" font-weight="700">¥3,000 added</text>
    <use href="#nav-dock" />
  </g>

  <!-- Desktop adaptation -->
  <text class="board-label" x="660" y="1030" text-anchor="middle">04 · DESKTOP · THE SAME COMPACT ACTION</text>
  <g transform="translate(35 1056)">
    <rect width="1250" height="556" rx="20" fill="#1D4E89" filter="url(#panel-shadow)" />
    <rect x="5" y="5" width="1240" height="546" rx="16" fill="#F4FAFB" />

    <text x="34" y="51" class="heading" font-size="26">Budgeting</text>
    <text x="34" y="88" class="heading" font-size="16">Weekly</text>
    <text x="101" y="88" class="secondary" font-size="11">3 lines · current week</text>

    <g transform="translate(850 38)">
      <use href="#previous-button" />
      <rect x="52" width="142" height="44" rx="10" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="123" y="18" class="eyebrow" text-anchor="middle">THIS WEEK</text>
      <text x="123" y="34" class="heading" font-size="12" text-anchor="middle">27 JUL–2 AUG</text>
      <use href="#next-button-disabled" x="202" />
    </g>

    <g transform="translate(34 106)">
      <rect width="1182" height="408" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <rect width="1182" height="42" rx="12" fill="#DFF4F4" />
      <rect y="30" width="1182" height="12" fill="#DFF4F4" />
      <text x="18" y="27" class="eyebrow">BUDGET LINE</text>
      <text x="330" y="27" class="eyebrow">SPENT / ALLOWANCE</text>
      <text x="610" y="27" class="eyebrow">DIFFERENCE</text>
      <text x="850" y="27" class="eyebrow">LAST WEEK</text>

      <g transform="translate(0 42)">
        <line x1="0" y1="116" x2="1182" y2="116" stroke="#E2ECEE" />
        <text x="18" y="31" class="heading" font-size="13">Eating Out</text>
        <text x="18" y="52" class="secondary" font-size="10">Eating out wallet</text>
        <text x="330" y="32" class="money" font-size="13">¥2,100 / ¥15,000</text>
        <rect x="330" y="47" width="190" height="7" rx="3.5" fill="#DFF4F4" />
        <rect x="330" y="47" width="27" height="7" rx="3.5" fill="#16679A" />
        <text x="610" y="32" class="money" font-size="13">¥12,900 left</text>
        <rect x="850" y="22" width="292" height="44" rx="10" fill="#FFFFFF" stroke="#16679A" />
        <text x="996" y="49" fill="#16679A" class="button" text-anchor="middle">Add ¥3,000 from last week</text>
      </g>

      <g transform="translate(0 158)">
        <line x1="0" y1="116" x2="1182" y2="116" stroke="#E2ECEE" />
        <text x="18" y="31" class="heading" font-size="13">Transport</text>
        <text x="18" y="52" class="secondary" font-size="10">Everyday account</text>
        <text x="330" y="32" class="money" font-size="13">¥4,000 / ¥20,000</text>
        <rect x="330" y="47" width="190" height="7" rx="3.5" fill="#DFF4F4" />
        <rect x="330" y="47" width="38" height="7" rx="3.5" fill="#16679A" />
        <text x="610" y="32" class="money" font-size="13">¥16,000 left</text>
        <rect x="850" y="22" width="292" height="44" rx="10" fill="#FFFFFF" stroke="#B42318" />
        <text x="996" y="49" class="danger button" text-anchor="middle">Subtract ¥2,500 from last week</text>
      </g>

      <g transform="translate(0 274)">
        <text x="18" y="31" class="heading" font-size="13">Weekly Groceries</text>
        <text x="18" y="52" class="secondary" font-size="10">Household account</text>
        <text x="330" y="32" class="money" font-size="13">¥6,800 / ¥18,600</text>
        <rect x="330" y="47" width="190" height="7" rx="3.5" fill="#DFF4F4" />
        <rect x="330" y="47" width="70" height="7" rx="3.5" fill="#16679A" />
        <text x="610" y="32" class="money" font-size="13">¥11,800 left</text>
        <text x="850" y="34" class="secondary" font-size="9.5">Included +¥6,600</text>
      </g>
    </g>
  </g>

  <text x="48" y="1660" fill="#526966" font-size="12">Decision note: if subtraction makes the allowance zero or negative, replace the utilization bar with an explicit starting-deficit message.</text>
  <text x="48" y="1685" fill="#526966" font-size="12">The action appears only in the current period and disappears after application; the allowance keeps one concise source note.</text>
</svg>

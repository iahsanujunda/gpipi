<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Gpipi household workflows in a Slack-like conversation</title>
  <desc id="description">A single household channel shows a member recording a ramen expense, adding milk, ground beef, and diapers to the shopping list, and asking the bot to display the current list.</desc>

  <defs>
    <filter id="window-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1D4E89" flood-opacity="0.18" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17312E" flood-opacity="0.10" />
    </filter>
    <style>
      text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .channel { fill: #FFFFFF; font-size: 14px; }
      .channel-muted { fill: #D9BADB; font-size: 14px; }
      .sender { fill: #17312E; font-size: 14px; font-weight: 750; }
      .time { fill: #6D7D7A; font-size: 11px; }
      .message { fill: #17312E; font-size: 14px; }
      .bot-heading { fill: #1D4E89; font-size: 14px; font-weight: 750; }
      .bot-copy { fill: #526966; font-size: 12px; }
      .eyebrow { fill: #16679A; font-size: 9.5px; font-weight: 800; letter-spacing: 1px; }
      .button { fill: #FFFFFF; font-size: 11px; font-weight: 750; }
    </style>

    <g id="member-avatar">
      <rect width="38" height="38" rx="9" fill="#F3C969" />
      <circle cx="19" cy="15" r="7" fill="#8C5D45" />
      <path d="M8 36c1-9 6-13 11-13s10 4 11 13" fill="#1D4E89" />
    </g>

    <g id="bot-avatar">
      <rect width="38" height="38" rx="9" fill="#16679A" />
      <rect x="9" y="9" width="8" height="8" rx="2" fill="#3FC1C0" />
      <rect x="21" y="9" width="8" height="8" rx="2" fill="#FFFFFF" />
      <rect x="9" y="21" width="8" height="8" rx="2" fill="#FFFFFF" />
      <rect x="21" y="21" width="8" height="8" rx="2" fill="#3FC1C0" />
    </g>

    <g id="check">
      <circle cx="8" cy="8" r="8" fill="#DFF4F4" />
      <path d="m4.5 8 2.2 2.3 4.8-5" fill="none" stroke="#167A72" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>

  <rect width="1440" height="900" fill="#E7F5F7" />

  <g transform="translate(0 -84)" filter="url(#window-shadow)">
    <rect x="44" y="108" width="1352" height="842" rx="28" fill="#FFFFFF" />

    <!-- Desktop chrome -->
    <path d="M72 108h1296a28 28 0 0 1 28 28v38H44v-38a28 28 0 0 1 28-28Z" fill="#350D36" />
    <circle cx="76" cy="141" r="6" fill="#FF6B6B" />
    <circle cx="98" cy="141" r="6" fill="#F4C95D" />
    <circle cx="120" cy="141" r="6" fill="#52C48A" />
    <rect x="516" y="124" width="410" height="34" rx="8" fill="#5B275C" />
    <path d="m540 141 5-5m-5 5 5 5m-5-5h12" fill="none" stroke="#E9DDEA" stroke-width="1.5" stroke-linecap="round" />
    <text x="575" y="146" fill="#F8F3F8" font-size="12">Search Household</text>

    <!-- Workspace sidebar -->
    <path d="M44 174h252v776H72a28 28 0 0 1-28-28Z" fill="#4A154B" />
    <text x="68" y="216" fill="#FFFFFF" font-size="18" font-weight="750">Household</text>
    <path d="m260 208 5 5 5-5" fill="none" stroke="#D9BADB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="44" y1="236" x2="296" y2="236" stroke="#7A3F7B" />

    <circle cx="78" cy="270" r="9" fill="none" stroke="#D9BADB" stroke-width="1.4" />
    <circle cx="78" cy="270" r="3" fill="#58C7B3" />
    <text x="98" y="275" class="channel-muted">Threads</text>

    <text x="68" y="324" fill="#D9BADB" font-size="12" font-weight="750">CHANNELS</text>
    <rect x="54" y="340" width="232" height="38" rx="7" fill="#1264A3" />
    <text x="72" y="365" class="channel" font-weight="700">#</text>
    <text x="94" y="365" class="channel" font-weight="700">household</text>
    <text x="72" y="407" class="channel-muted">#</text>
    <text x="94" y="407" class="channel-muted">random</text>
    <text x="72" y="447" class="channel-muted">#</text>
    <text x="94" y="447" class="channel-muted">recipes</text>

    <text x="68" y="512" fill="#D9BADB" font-size="12" font-weight="750">DIRECT MESSAGES</text>
    <circle cx="78" cy="542" r="11" fill="#16679A" />
    <rect x="73" y="537" width="4" height="4" rx="1" fill="#3FC1C0" />
    <rect x="79" y="537" width="4" height="4" rx="1" fill="#FFFFFF" />
    <rect x="73" y="543" width="4" height="4" rx="1" fill="#FFFFFF" />
    <rect x="79" y="543" width="4" height="4" rx="1" fill="#3FC1C0" />
    <text x="98" y="547" class="channel-muted">gpipi</text>

    <rect x="60" y="886" width="220" height="48" rx="10" fill="#3C103D" />
    <circle cx="82" cy="910" r="13" fill="#F3C969" />
    <circle cx="82" cy="906" r="5" fill="#8C5D45" />
    <path d="M73 921c1-6 4-9 9-9s8 3 9 9" fill="#1D4E89" />
    <text x="105" y="907" fill="#FFFFFF" font-size="12" font-weight="700">iahsanujunda</text>
    <text x="105" y="922" fill="#CFAFD0" font-size="10">Active</text>

    <!-- Channel header -->
    <rect x="296" y="174" width="1100" height="72" fill="#FFFFFF" />
    <text x="324" y="207" fill="#17312E" font-size="18" font-weight="750"># household</text>
    <text x="324" y="228" fill="#526966" font-size="11">Shared spending, errands, and household plans</text>
    <circle cx="1308" cy="207" r="16" fill="#DFF4F4" />
    <circle cx="1327" cy="207" r="16" fill="#F3C969" />
    <rect x="1349" y="190" width="30" height="34" rx="8" fill="#FFFFFF" stroke="#C9D4D2" />
    <text x="1364" y="212" fill="#526966" font-size="12" text-anchor="middle">2</text>
    <line x1="296" y1="245.5" x2="1396" y2="245.5" stroke="#D8E2E0" />

    <!-- Flow 1: expense -->
    <rect x="320" y="265" width="1048" height="194" rx="14" fill="#F8FBFB" />
    <rect x="336" y="280" width="84" height="22" rx="11" fill="#DFF4F4" />
    <text x="378" y="295" class="eyebrow" text-anchor="middle">01 · EXPENSE</text>
    <g transform="translate(338 316)"><use href="#member-avatar" /></g>
    <text x="388" y="330" class="sender">iahsanujunda</text>
    <text x="486" y="330" class="time">9:31 AM</text>
    <text x="388" y="350" class="message"><tspan fill="#1264A3" font-weight="700">@gpipi</tspan><tspan> just paid 1,500 JPY for ramen</tspan></text>

    <g transform="translate(338 369)"><use href="#bot-avatar" /></g>
    <text x="388" y="383" class="sender">gpipi</text>
    <rect x="446" y="373" width="31" height="16" rx="4" fill="#E7EEF0" />
    <text x="461.5" y="384" fill="#526966" font-size="8" font-weight="750" text-anchor="middle">APP</text>
    <text x="486" y="383" class="time">9:31 AM</text>
    <g filter="url(#card-shadow)">
      <rect x="388" y="397" width="754" height="48" rx="9" fill="#FFFFFF" stroke="#C9D4D2" />
      <rect x="388" y="397" width="4" height="48" rx="2" fill="#3FC1C0" />
      <text x="408" y="417" class="bot-heading">¥1,500 · Ramen</text>
      <rect x="584" y="406" width="146" height="28" rx="6" fill="#FFFFFF" stroke="#AEBEBC" />
      <text x="598" y="424" class="bot-copy">Eating Out</text>
      <path d="m709 417 4 4 4-4" fill="none" stroke="#526966" stroke-width="1.4" />
      <rect x="744" y="406" width="82" height="28" rx="6" fill="#16679A" />
      <text x="785" y="424" class="button" text-anchor="middle">Confirm</text>
      <rect x="838" y="406" width="112" height="28" rx="6" fill="#FFFFFF" stroke="#AEBEBC" />
      <text x="894" y="424" fill="#526966" font-size="11" font-weight="700" text-anchor="middle">Not an expense</text>
    </g>

    <!-- Flow 2: add shopping items -->
    <rect x="320" y="475" width="1048" height="210" rx="14" fill="#F8FBFB" />
    <rect x="336" y="490" width="112" height="22" rx="11" fill="#DFF4F4" />
    <text x="392" y="505" class="eyebrow" text-anchor="middle">02 · ADD ITEMS</text>
    <g transform="translate(338 526)"><use href="#member-avatar" /></g>
    <text x="388" y="540" class="sender">iahsanujunda</text>
    <text x="486" y="540" class="time">9:34 AM</text>
    <text x="388" y="560" class="message"><tspan fill="#1264A3" font-weight="700">@gpipi</tspan><tspan> list add milk, 1 kg ground beef, and diapers size L for night</tspan></text>

    <g transform="translate(338 578)"><use href="#bot-avatar" /></g>
    <text x="388" y="592" class="sender">gpipi</text>
    <rect x="446" y="582" width="31" height="16" rx="4" fill="#E7EEF0" />
    <text x="461.5" y="593" fill="#526966" font-size="8" font-weight="750" text-anchor="middle">APP</text>
    <g filter="url(#card-shadow)">
      <rect x="388" y="606" width="754" height="65" rx="9" fill="#FFFFFF" stroke="#C9D4D2" />
      <rect x="388" y="606" width="4" height="65" rx="2" fill="#3FC1C0" />
      <text x="408" y="626" class="bot-heading">Add to shopping list?</text>
      <text x="408" y="647" class="bot-copy">• Milk   ·   • Ground beef — 1 kg   ·   • Diapers — size L, for night</text>
      <rect x="950" y="621" width="82" height="30" rx="6" fill="#16679A" />
      <text x="991" y="640" class="button" text-anchor="middle">Add all</text>
      <rect x="1042" y="621" width="78" height="30" rx="6" fill="#FFFFFF" stroke="#AEBEBC" />
      <text x="1081" y="640" fill="#526966" font-size="11" font-weight="700" text-anchor="middle">Cancel</text>
    </g>

    <!-- Flow 3: show list -->
    <rect x="320" y="701" width="1048" height="216" rx="14" fill="#F8FBFB" />
    <rect x="336" y="716" width="112" height="22" rx="11" fill="#DFF4F4" />
    <text x="392" y="731" class="eyebrow" text-anchor="middle">03 · SHOW LIST</text>
    <g transform="translate(338 752)"><use href="#member-avatar" /></g>
    <text x="388" y="766" class="sender">iahsanujunda</text>
    <text x="486" y="766" class="time">9:37 AM</text>
    <text x="388" y="786" class="message"><tspan fill="#1264A3" font-weight="700">@gpipi</tspan><tspan> list</tspan></text>

    <g transform="translate(338 804)"><use href="#bot-avatar" /></g>
    <text x="388" y="818" class="sender">gpipi</text>
    <rect x="446" y="808" width="31" height="16" rx="4" fill="#E7EEF0" />
    <text x="461.5" y="819" fill="#526966" font-size="8" font-weight="750" text-anchor="middle">APP</text>
    <g filter="url(#card-shadow)">
      <rect x="388" y="832" width="754" height="70" rx="9" fill="#FFFFFF" stroke="#C9D4D2" />
      <rect x="388" y="832" width="4" height="70" rx="2" fill="#3FC1C0" />
      <text x="408" y="852" class="bot-heading">Shopping list · 3 items</text>
      <g transform="translate(408 866)"><use href="#check" /></g>
      <text x="430" y="879" class="bot-copy">Milk</text>
      <g transform="translate(525 866)"><use href="#check" /></g>
      <text x="547" y="879" class="bot-copy">Ground beef · 1 kg</text>
      <g transform="translate(718 866)"><use href="#check" /></g>
      <text x="740" y="879" class="bot-copy">Diapers · size L</text>
      <rect x="972" y="851" width="148" height="32" rx="6" fill="#16679A" />
      <text x="1046" y="871" class="button" text-anchor="middle">Mark bought</text>
    </g>

    <!-- Composer -->
    <rect x="1178" y="268" width="170" height="34" rx="17" fill="#FFFFFF" stroke="#C9D4D2" />
    <circle cx="1200" cy="285" r="9" fill="#16679A" />
    <path d="m1196 285 3 3 5-7" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1217" y="290" fill="#526966" font-size="10.5">Recorded after confirm</text>
  </g>
</svg>

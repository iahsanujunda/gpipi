<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img" aria-labelledby="title description">
  <title id="title">Gpipi mobile web app overview</title>
  <desc id="description">Three mobile screens show budget utilization, expense activity, and the shopping list. The shopping-list screen has the main navigation launcher expanded with links to all three destinations.</desc>

  <defs>
    <clipPath id="screen-clip">
      <rect x="8" y="8" width="374" height="744" rx="40" />
    </clipPath>
    <filter id="phone-shadow" x="-20%" y="-10%" width="140%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#1D4E89" flood-opacity="0.18" />
    </filter>
    <filter id="control-shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1D4E89" flood-opacity="0.24" />
    </filter>
    <style>
      text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #16679A; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; }
      .heading { fill: #1D4E89; font-weight: 750; }
      .body { fill: #17312E; }
      .secondary { fill: #526966; }
      .tiny { fill: #526966; font-size: 9.5px; }
    </style>

    <g id="phone-shell">
      <rect width="390" height="760" rx="48" fill="#1D4E89" filter="url(#phone-shadow)" />
      <rect x="8" y="8" width="374" height="744" rx="40" fill="#F4FAFB" />
      <g clip-path="url(#screen-clip)">
        <rect x="8" y="8" width="374" height="744" fill="#F4FAFB" />
        <rect x="8" y="8" width="374" height="34" fill="#FFFFFF" />
        <text x="27" y="31" fill="#1D4E89" font-size="11" font-weight="700">9:41</text>
        <g fill="none" stroke="#1D4E89" stroke-width="1.5" stroke-linecap="round">
          <path d="M329 26c4-5 9-5 13 0" />
          <path d="M332 29c2-3 5-3 7 0" />
          <rect x="350" y="21" width="18" height="10" rx="2" />
        </g>
        <rect x="352.5" y="23.5" width="12.5" height="5" rx="1" fill="#1D4E89" />
        <rect x="8" y="42" width="374" height="54" fill="#FFFFFF" />
        <path d="M35 58 26 68l9 10M27 68h17" fill="none" stroke="#1D4E89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="54" y="74" fill="#1D4E89" font-size="16" font-weight="700">gpipi</text>
        <line x1="8" y1="95.5" x2="382" y2="95.5" stroke="#C9E2E5" />
      </g>
      <rect x="146" y="14" width="98" height="20" rx="10" fill="#1D4E89" />
    </g>

    <g id="launcher">
      <circle cx="195" cy="715" r="28" fill="#16679A" filter="url(#control-shadow)" />
      <rect x="183" y="703" width="10" height="10" rx="2.5" fill="#3FC1C0" />
      <rect x="198" y="703" width="10" height="10" rx="2.5" fill="#FFFFFF" />
      <rect x="183" y="718" width="10" height="10" rx="2.5" fill="#FFFFFF" />
      <rect x="198" y="718" width="10" height="10" rx="2.5" fill="#3FC1C0" />
    </g>

    <g id="close-launcher">
      <circle cx="195" cy="715" r="28" fill="#16679A" filter="url(#control-shadow)" />
      <path d="m186 706 18 18m0-18-18 18" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
    </g>

    <g id="budget-icon">
      <rect x="0" y="4" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" />
      <path d="M4 4V1h10v3M9 9v7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
    </g>

    <g id="activity-icon">
      <path d="M1 1h17v23l-4-3-4.5 3L5 21l-4 3zm5 7h7m-7 5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g id="shopping-icon">
      <path d="M2 6h18l-2 13H4L2 6Zm4 0c0-3 2-5 5-5s5 2 5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>

  <rect width="1440" height="870" fill="#E7F5F7" />

  <g transform="translate(0 -80)">
    <text x="235" y="128" class="label" text-anchor="middle">BUDGETS</text>
    <text x="720" y="128" class="label" text-anchor="middle">ACTIVITY</text>
    <text x="1205" y="128" class="label" text-anchor="middle">SHOPPING + NAVIGATION</text>

  <!-- Budget phone -->
  <g transform="translate(40 154)">
    <use href="#phone-shell" />
    <g clip-path="url(#screen-clip)">
      <text x="24" y="134" class="heading" font-size="28">Budgeting</text>
      <text x="24" y="158" class="secondary" font-size="12">See every cap against actual spending.</text>

      <text x="24" y="197" class="heading" font-size="14">This week</text>
      <text x="366" y="197" class="secondary" font-size="10" text-anchor="end">20–26 Jul</text>
      <rect x="24" y="210" width="342" height="128" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="42" y="237" class="heading" font-size="16">Eating Out</text>
      <rect x="290" y="220" width="58" height="22" rx="11" fill="#DFF4F4" />
      <text x="319" y="235" class="secondary" font-size="9" font-weight="700" text-anchor="middle">WEEKLY</text>
      <text x="42" y="265" class="secondary" font-size="10">Spent</text>
      <text x="42" y="286" class="body" font-size="17" font-weight="750">¥9,800</text>
      <text x="348" y="286" class="secondary" font-size="11" text-anchor="end">¥5,200 left</text>
      <rect x="42" y="303" width="306" height="8" rx="4" fill="#DCEBED" />
      <rect x="42" y="303" width="200" height="8" rx="4" fill="#3FC1C0" />
      <text x="42" y="327" class="tiny">65% of ¥15,000</text>

      <text x="24" y="379" class="heading" font-size="14">This month</text>
      <text x="366" y="379" class="secondary" font-size="10" text-anchor="end">July 2026</text>
      <rect x="24" y="392" width="342" height="128" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="42" y="419" class="heading" font-size="16">Monthly Groceries</text>
      <rect x="282" y="402" width="66" height="22" rx="11" fill="#DFF4F4" />
      <text x="315" y="417" class="secondary" font-size="8.5" font-weight="700" text-anchor="middle">MONTHLY</text>
      <text x="42" y="447" class="secondary" font-size="10">Spent</text>
      <text x="42" y="468" class="body" font-size="17" font-weight="750">¥63,500</text>
      <text x="348" y="468" fill="#B64646" font-size="11" font-weight="700" text-anchor="end">¥3,500 over</text>
      <rect x="42" y="485" width="306" height="8" rx="4" fill="#DCEBED" />
      <rect x="42" y="485" width="306" height="8" rx="4" fill="#D86464" />
      <text x="42" y="509" fill="#B64646" font-size="9.5" font-weight="700">106% of ¥60,000 · OVER CAP</text>

      <rect x="24" y="544" width="342" height="82" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="42" y="571" class="heading" font-size="15">Transport</text>
      <text x="42" y="594" class="secondary" font-size="10">¥8,200 spent of ¥20,000</text>
      <rect x="42" y="607" width="306" height="7" rx="3.5" fill="#DCEBED" />
      <rect x="42" y="607" width="125" height="7" rx="3.5" fill="#3FC1C0" />

      <rect x="8" y="674" width="374" height="78" fill="#F4FAFB" fill-opacity=".98" />
      <line x1="8" y1="674" x2="382" y2="674" stroke="#D9E9EB" />
      <use href="#launcher" />
    </g>
  </g>

  <!-- Activity phone -->
  <g transform="translate(525 154)">
    <use href="#phone-shell" />
    <g clip-path="url(#screen-clip)">
      <text x="24" y="134" class="heading" font-size="28">Activity</text>
      <text x="24" y="158" class="secondary" font-size="12">Review expenses recorded through Slack.</text>

      <rect x="24" y="181" width="342" height="102" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="42" y="207" class="heading" font-size="14">Refine activity</text>
      <rect x="42" y="222" width="190" height="42" rx="9" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="54" y="237" class="tiny" font-weight="700">CATEGORY</text>
      <text x="54" y="255" class="body" font-size="11">All categories</text>
      <path d="m216 239 4 4 4-4" fill="none" stroke="#526966" stroke-width="1.5" />
      <rect x="242" y="222" width="106" height="42" rx="9" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="254" y="237" class="tiny" font-weight="700">SORT</text>
      <text x="254" y="255" class="body" font-size="11">Newest</text>

      <text x="24" y="320" class="heading" font-size="14">Recent expenses</text>
      <text x="366" y="320" class="secondary" font-size="10" text-anchor="end">24–22 Jul</text>

      <g>
        <rect x="24" y="334" width="342" height="96" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
        <circle cx="56" cy="366" r="18" fill="#DFF4F4" />
        <path d="M49 367h14m-11-6h8m-8 12h8" fill="none" stroke="#16679A" stroke-width="1.6" stroke-linecap="round" />
        <text x="84" y="361" class="heading" font-size="15">FamilyMart</text>
        <text x="348" y="361" class="heading" font-size="15" text-anchor="end">¥510</text>
        <text x="84" y="382" class="secondary" font-size="10">Convenience Store</text>
        <text x="84" y="407" class="tiny">Today · 08:24</text>
      </g>
      <g>
        <rect x="24" y="444" width="342" height="96" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
        <circle cx="56" cy="476" r="18" fill="#DFF4F4" />
        <path d="M49 477h14m-11-6h8m-8 12h8" fill="none" stroke="#16679A" stroke-width="1.6" stroke-linecap="round" />
        <text x="84" y="471" class="heading" font-size="15">Ito Yokado</text>
        <text x="348" y="471" class="heading" font-size="15" text-anchor="end">¥7,500</text>
        <text x="84" y="492" class="secondary" font-size="10">Monthly Groceries</text>
        <text x="84" y="517" class="tiny">Yesterday · 18:06</text>
      </g>
      <g>
        <rect x="24" y="554" width="342" height="96" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
        <circle cx="56" cy="586" r="18" fill="#DFF4F4" />
        <path d="M49 587h14m-11-6h8m-8 12h8" fill="none" stroke="#16679A" stroke-width="1.6" stroke-linecap="round" />
        <text x="84" y="581" class="heading" font-size="15">JR East</text>
        <text x="348" y="581" class="heading" font-size="15" text-anchor="end">¥1,200</text>
        <text x="84" y="602" class="secondary" font-size="10">Transport</text>
        <text x="84" y="627" class="tiny">22 Jul · 07:42</text>
      </g>

      <rect x="8" y="674" width="374" height="78" fill="#F4FAFB" fill-opacity=".98" />
      <line x1="8" y1="674" x2="382" y2="674" stroke="#D9E9EB" />
      <use href="#launcher" />
    </g>
  </g>

  <!-- Shopping phone with open navigation -->
  <g transform="translate(1010 154)">
    <use href="#phone-shell" />
    <g clip-path="url(#screen-clip)">
      <text x="24" y="134" class="heading" font-size="28">Shopping list</text>
      <text x="24" y="158" class="secondary" font-size="12">Items added by the household in Slack.</text>

      <rect x="24" y="181" width="342" height="74" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <circle cx="49" cy="211" r="9" fill="#DFF4F4" stroke="#3FC1C0" />
      <text x="69" y="207" class="heading" font-size="15">Milk</text>
      <text x="69" y="226" class="secondary" font-size="10">1 carton · low fat</text>
      <rect x="319" y="196" width="30" height="30" rx="8" fill="#FFFFFF" stroke="#C9E2E5" />
      <path d="m327 217 2-6 8-8 5 5-8 8-7 1" fill="none" stroke="#16679A" stroke-width="1.4" />

      <rect x="24" y="267" width="342" height="74" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <circle cx="49" cy="297" r="9" fill="#DFF4F4" stroke="#3FC1C0" />
      <text x="69" y="293" class="heading" font-size="15">Ground beef</text>
      <text x="69" y="312" class="secondary" font-size="10">1 kg · for hamburgers</text>
      <rect x="319" y="282" width="30" height="30" rx="8" fill="#FFFFFF" stroke="#C9E2E5" />
      <path d="m327 303 2-6 8-8 5 5-8 8-7 1" fill="none" stroke="#16679A" stroke-width="1.4" />

      <rect x="24" y="353" width="342" height="74" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <circle cx="49" cy="383" r="9" fill="#DFF4F4" stroke="#3FC1C0" />
      <text x="69" y="379" class="heading" font-size="15">Diapers</text>
      <text x="69" y="398" class="secondary" font-size="10">Size L · for night</text>

      <!-- Open navigation overlay -->
      <rect x="8" y="96" width="374" height="656" fill="#1D4E89" fill-opacity=".40" />
      <path d="M195 684V430" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="2" stroke-dasharray="4 8" />
      <rect x="85" y="420" width="88" height="22" rx="11" fill="#1D4E89" />
      <text x="129" y="435" fill="#FFFFFF" font-size="9.5" font-weight="800" letter-spacing="1" text-anchor="middle">NAVIGATION</text>
      <line x1="181" y1="431" x2="305" y2="431" stroke="#3FC1C0" stroke-width="2" stroke-linecap="round" />

      <g filter="url(#control-shadow)">
        <rect x="85" y="454" width="220" height="48" rx="24" fill="#FFFFFF" />
        <g transform="translate(105 467)" color="#16679A"><use href="#budget-icon" /></g>
        <text x="141" y="484" class="heading" font-size="14">Budgets</text>

        <rect x="85" y="512" width="220" height="48" rx="24" fill="#FFFFFF" />
        <g transform="translate(105 523)" color="#16679A"><use href="#activity-icon" /></g>
        <text x="141" y="542" class="heading" font-size="14">Activity</text>

        <rect x="85" y="570" width="220" height="48" rx="24" fill="#16679A" />
        <g transform="translate(104 581)" color="#FFFFFF"><use href="#shopping-icon" /></g>
        <text x="141" y="600" fill="#FFFFFF" font-size="14" font-weight="750">Shopping list</text>
        <circle cx="282" cy="594" r="3.5" fill="#FFFFFF" />
      </g>

      <rect x="8" y="674" width="374" height="78" fill="#F4FAFB" fill-opacity=".95" />
      <line x1="8" y1="674" x2="382" y2="674" stroke="#D9E9EB" />
      <use href="#close-launcher" />
    </g>
  </g>

  </g>
</svg>

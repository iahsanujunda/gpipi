<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title description">
  <title id="title">Gpipi household assistant workflows in Slack</title>
  <desc id="description">A Slack channel shows expense capture, shopping-list confirmation, a checkable shopping list, and the button that opens the household web app.</desc>

  <defs>
    <filter id="window-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1D4E89" flood-opacity="0.18" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17312E" flood-opacity="0.09" />
    </filter>
    <style>
      text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .channel { fill: #1D1C1D; font-size: 20px; font-weight: 750; }
      .name { fill: #1D1C1D; font-size: 15px; font-weight: 750; }
      .time { fill: #616061; font-size: 11px; }
      .body { fill: #1D1C1D; font-size: 15px; }
      .muted { fill: #616061; font-size: 13px; }
      .control { fill: #1D1C1D; font-size: 13px; font-weight: 650; }
      .sidebar { fill: #FFFFFF; font-size: 14px; }
      .sidebar-muted { fill: #D7D3D7; font-size: 13px; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="#E7F5F7" />
  <rect x="40" y="32" width="1360" height="916" rx="18" fill="#FFFFFF" filter="url(#window-shadow)" />

  <!-- Slack chrome and workspace navigation -->
  <path d="M58 32h1324a18 18 0 0 1 18 18v42H40V50a18 18 0 0 1 18-18Z" fill="#2B092F" />
  <circle cx="68" cy="62" r="6" fill="#ED6A5E" />
  <circle cx="88" cy="62" r="6" fill="#F5BF4F" />
  <circle cx="108" cy="62" r="6" fill="#61C454" />
  <rect x="480" y="46" width="480" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.14" />
  <path d="M507 61a6 6 0 1 1-2-4.5M511 65l4 4" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.7" stroke-linecap="round" />
  <text x="535" y="67" fill="#FFFFFF" fill-opacity="0.82" font-size="13">Search gpipi home</text>

  <path d="M40 92h254v856H58a18 18 0 0 1-18-18Z" fill="#3F0E40" />
  <rect x="40" y="92" width="254" height="68" fill="#350D36" />
  <text x="64" y="123" class="sidebar" font-size="17" font-weight="750">gpipi home</text>
  <text x="64" y="145" class="sidebar-muted">Household workspace</text>
  <circle cx="268" cy="122" r="14" fill="#FFFFFF" fill-opacity="0.12" />
  <path d="M263 122h10M268 117v10" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />

  <text x="64" y="196" class="sidebar-muted" font-weight="700">Channels</text>
  <rect x="48" y="214" width="238" height="36" rx="6" fill="#1164A3" />
  <text x="66" y="237" class="sidebar" font-weight="700">#  household</text>
  <text x="66" y="278" class="sidebar-muted">#  general</text>
  <text x="66" y="312" class="sidebar-muted">#  meal-planning</text>
  <text x="64" y="366" class="sidebar-muted" font-weight="700">Direct messages</text>
  <circle cx="73" cy="394" r="9" fill="#3FC1C0" />
  <text x="91" y="399" class="sidebar">gpipi</text>
  <rect x="64" y="892" width="206" height="38" rx="9" fill="#FFFFFF" fill-opacity="0.1" />
  <circle cx="84" cy="911" r="10" fill="#D6A263" />
  <text x="102" y="916" class="sidebar" font-weight="650">iahsanujunda</text>

  <!-- Channel header -->
  <rect x="294" y="92" width="1106" height="68" fill="#FFFFFF" />
  <line x1="294" y1="159.5" x2="1400" y2="159.5" stroke="#DDDADD" />
  <text x="326" y="125" class="channel"># household</text>
  <text x="326" y="147" class="muted">Expenses, shopping, and household planning</text>
  <circle cx="1329" cy="126" r="16" fill="#F4FAFB" stroke="#C9E2E5" />
  <circle cx="1368" cy="126" r="16" fill="#F4FAFB" stroke="#C9E2E5" />
  <text x="1329" y="131" text-anchor="middle" fill="#1D4E89" font-size="15" font-weight="700">i</text>
  <text x="1368" y="131" text-anchor="middle" fill="#1D4E89" font-size="18">⋯</text>

  <!-- Expense workflow -->
  <circle cx="334" cy="195" r="20" fill="#D6A263" />
  <path d="M320 210c3-10 9-15 14-15s11 5 14 15" fill="#8B5D36" opacity="0.5" />
  <text x="370" y="188" class="name">iahsanujunda</text>
  <text x="486" y="188" class="time">9:31 AM</text>
  <text x="370" y="211" class="body"><tspan fill="#1264A3" font-weight="650">@gpipi</tspan><tspan> 510 FamilyMart</tspan></text>

  <rect x="322" y="230" width="516" height="150" rx="10" fill="#FFFFFF" stroke="#D7D3D7" filter="url(#card-shadow)" />
  <rect x="322" y="230" width="4" height="150" rx="2" fill="#3FC1C0" />
  <circle cx="352" cy="258" r="18" fill="#1D4E89" />
  <text x="352" y="264" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">G</text>
  <text x="382" y="254" class="name">gpipi</text>
  <rect x="423" y="241" width="34" height="17" rx="4" fill="#ECEAEC" />
  <text x="440" y="253" text-anchor="middle" fill="#616061" font-size="9" font-weight="800">APP</text>
  <text x="382" y="274" class="time">9:31 AM</text>
  <text x="346" y="307" class="body" font-weight="750">¥510 · FamilyMart</text>
  <rect x="346" y="326" width="174" height="36" rx="6" fill="#FFFFFF" stroke="#8D8D8D" />
  <text x="360" y="349" class="control">Convenience store</text>
  <path d="m499 340 5 5 5-5" fill="none" stroke="#616061" stroke-width="1.6" />
  <rect x="530" y="326" width="92" height="36" rx="6" fill="#16679A" />
  <text x="576" y="349" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="750">Confirm</text>
  <rect x="632" y="326" width="136" height="36" rx="6" fill="#FFFFFF" stroke="#8D8D8D" />
  <text x="700" y="349" text-anchor="middle" class="control">Not an expense</text>

  <!-- Shopping add workflow -->
  <circle cx="334" cy="427" r="20" fill="#D6A263" />
  <path d="M320 442c3-10 9-15 14-15s11 5 14 15" fill="#8B5D36" opacity="0.5" />
  <text x="370" y="420" class="name">iahsanujunda</text>
  <text x="486" y="420" class="time">9:34 AM</text>
  <text x="370" y="443" class="body"><tspan fill="#1264A3" font-weight="650">@gpipi</tspan><tspan> list add milk, 2 eggs, coffee beans</tspan></text>

  <rect x="322" y="462" width="516" height="162" rx="10" fill="#FFFFFF" stroke="#D7D3D7" filter="url(#card-shadow)" />
  <rect x="322" y="462" width="4" height="162" rx="2" fill="#3FC1C0" />
  <circle cx="352" cy="490" r="18" fill="#1D4E89" />
  <text x="352" y="496" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">G</text>
  <text x="382" y="486" class="name">gpipi</text>
  <rect x="423" y="473" width="34" height="17" rx="4" fill="#ECEAEC" />
  <text x="440" y="485" text-anchor="middle" fill="#616061" font-size="9" font-weight="800">APP</text>
  <text x="346" y="526" class="body" font-weight="750">Add to shopping list?</text>
  <text x="346" y="552" class="body">• Milk</text>
  <text x="346" y="576" class="body">• Eggs · 2</text>
  <text x="346" y="600" class="body">• Coffee beans</text>
  <rect x="594" y="566" width="108" height="38" rx="6" fill="#16679A" />
  <text x="648" y="590" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="750">Add items</text>
  <rect x="712" y="566" width="92" height="38" rx="6" fill="#FFFFFF" stroke="#8D8D8D" />
  <text x="758" y="590" text-anchor="middle" class="control">Cancel</text>

  <!-- Shopping list workflow -->
  <circle cx="334" cy="671" r="20" fill="#D6A263" />
  <path d="M320 686c3-10 9-15 14-15s11 5 14 15" fill="#8B5D36" opacity="0.5" />
  <text x="370" y="664" class="name">iahsanujunda</text>
  <text x="486" y="664" class="time">9:36 AM</text>
  <text x="370" y="687" class="body"><tspan fill="#1264A3" font-weight="650">@gpipi</tspan><tspan> list</tspan></text>

  <rect x="322" y="706" width="516" height="160" rx="10" fill="#FFFFFF" stroke="#D7D3D7" filter="url(#card-shadow)" />
  <rect x="322" y="706" width="4" height="160" rx="2" fill="#3FC1C0" />
  <circle cx="352" cy="734" r="18" fill="#1D4E89" />
  <text x="352" y="740" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">G</text>
  <text x="382" y="730" class="name">gpipi</text>
  <rect x="423" y="717" width="34" height="17" rx="4" fill="#ECEAEC" />
  <text x="440" y="729" text-anchor="middle" fill="#616061" font-size="9" font-weight="800">APP</text>
  <text x="346" y="770" class="body" font-weight="750">Shopping list</text>
  <rect x="346" y="790" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#616061" />
  <text x="376" y="804" class="body">Milk</text>
  <rect x="346" y="824" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#616061" />
  <text x="376" y="838" class="body">Eggs · 2</text>
  <rect x="520" y="790" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#616061" />
  <text x="550" y="804" class="body">Coffee beans</text>

  <!-- Open-web-app workflow -->
  <text x="900" y="242" fill="#616061" font-size="11" font-weight="750" letter-spacing="1.2">OPEN THE WEB APP</text>
  <line x1="900" y1="254" x2="1330" y2="254" stroke="#C9E2E5" />
  <circle cx="920" cy="293" r="20" fill="#D6A263" />
  <path d="M906 308c3-10 9-15 14-15s11 5 14 15" fill="#8B5D36" opacity="0.5" />
  <text x="956" y="286" class="name">iahsanujunda</text>
  <text x="1072" y="286" class="time">9:38 AM</text>
  <text x="956" y="309" class="body"><tspan fill="#1264A3" font-weight="650">@gpipi</tspan><tspan> open</tspan></text>

  <rect x="908" y="330" width="422" height="150" rx="10" fill="#FFFFFF" stroke="#D7D3D7" filter="url(#card-shadow)" />
  <rect x="908" y="330" width="4" height="150" rx="2" fill="#3FC1C0" />
  <circle cx="938" cy="358" r="18" fill="#1D4E89" />
  <text x="938" y="364" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">G</text>
  <text x="968" y="354" class="name">gpipi</text>
  <rect x="1009" y="341" width="34" height="17" rx="4" fill="#ECEAEC" />
  <text x="1026" y="353" text-anchor="middle" fill="#616061" font-size="9" font-weight="800">APP</text>
  <text x="968" y="376" class="time">9:38 AM</text>
  <text x="932" y="408" class="muted">Only visible to you</text>
  <rect x="932" y="426" width="130" height="36" rx="6" fill="#16679A" />
  <text x="997" y="449" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="750">Open budget</text>

  <rect x="908" y="510" width="422" height="42" rx="21" fill="#DFF4F4" />
  <text x="1119" y="536" text-anchor="middle" fill="#1D4E89" font-size="12" font-weight="700">Private, one-time authenticated link</text>

  <!-- Composer -->
  <rect x="322" y="892" width="1050" height="40" rx="8" fill="#FFFFFF" stroke="#8D8D8D" />
  <text x="344" y="917" fill="#8D8D8D" font-size="14">Message #household</text>
  <circle cx="1348" cy="912" r="13" fill="#E7F5F7" />
  <path d="m1343 912 4 4 7-9" fill="none" stroke="#16679A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="430" height="940" viewBox="0 0 430 940" role="img" aria-labelledby="title description">
  <title id="title">Gpipi training workout logging page on mobile</title>
  <desc id="description">The Training page shows the active program, workout and week selectors, an in-progress session date, one exercise prescription, one logged set, and exactly one empty editor for the next stable set slot.</desc>

  <defs>
    <clipPath id="screen-clip">
      <rect x="28" y="18" width="374" height="904" rx="40" />
    </clipPath>
    <filter id="phone-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1D4E89" flood-opacity="0.18" />
    </filter>
    <filter id="control-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1D4E89" flood-opacity="0.22" />
    </filter>
    <style>
      text { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { fill: #1D4E89; font-weight: 720; letter-spacing: -.3px; }
      .body { fill: #17312E; }
      .secondary { fill: #526966; }
      .eyebrow { fill: #526966; font-size: 9px; font-weight: 750; letter-spacing: .75px; }
      .chip { fill: #526966; font-size: 9px; font-weight: 720; letter-spacing: .45px; }
    </style>
  </defs>

  <rect width="430" height="940" fill="#E7F5F7" />
  <rect x="20" y="8" width="390" height="924" rx="50" fill="#1D4E89" filter="url(#phone-shadow)" />
  <rect x="28" y="18" width="374" height="904" rx="40" fill="#F4FAFB" />

  <g clip-path="url(#screen-clip)">
    <rect x="28" y="18" width="374" height="904" fill="#F4FAFB" />

    <!-- Mobile status bar -->
    <rect x="28" y="18" width="374" height="38" fill="#FFFFFF" />
    <text x="48" y="42" class="heading" font-size="13">9:41</text>
    <g fill="none" stroke="#1D4E89" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M348 38c4-5 9-5 13 0" />
      <path d="M351 41c2-3 5-3 7 0" />
      <circle cx="354.5" cy="44" r="1" fill="#1D4E89" stroke="none" />
      <rect x="370" y="33" width="18" height="10" rx="2" />
      <path d="M389 36v4" />
    </g>
    <rect x="372.5" y="35.5" width="12.5" height="5" rx="1" fill="#1D4E89" />

    <!-- Shared application bar -->
    <rect x="28" y="56" width="374" height="58" fill="#FFFFFF" />
    <rect x="36" y="63" width="44" height="44" rx="10" fill="#FFFFFF" />
    <path d="M59 75 49 85l10 10M50 85h18" fill="none" stroke="#1D4E89" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="88" y="91" class="heading" font-size="17">gpipi</text>
    <line x1="28" y1="113.5" x2="402" y2="113.5" stroke="#C9E2E5" />

    <!-- Page heading and active program -->
    <text x="44" y="157" class="heading" font-size="30" letter-spacing="-.8">Training</text>
    <rect x="282" y="133" width="104" height="27" rx="13.5" fill="#DFF4F4" />
    <circle cx="297" cy="146.5" r="4" fill="#16679A" />
    <text x="309" y="150" class="chip">M1 · ACTIVE</text>

    <!-- Workout and week selectors -->
    <text x="44" y="185" class="eyebrow">WORKOUT</text>
    <text x="278" y="185" class="eyebrow">WEEK</text>
    <rect x="44" y="193" width="222" height="52" rx="10" fill="#FFFFFF" stroke="#C9E2E5" />
    <text x="60" y="224" class="body" font-size="15" font-weight="650">Full Body 1</text>
    <path d="m242 214 6 6 6-6" fill="none" stroke="#526966" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="278" y="193" width="108" height="52" rx="10" fill="#FFFFFF" stroke="#C9E2E5" />
    <text x="294" y="224" class="body" font-size="15" font-weight="650">Week 3</text>
    <path d="m365 214 6 6 6-6" fill="none" stroke="#526966" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Session status -->
    <rect x="44" y="261" width="342" height="52" rx="11" fill="#FFFFFF" stroke="#C9E2E5" />
    <rect x="57" y="274" width="89" height="26" rx="13" fill="#DFF4F4" />
    <circle cx="70" cy="287" r="4" fill="#16679A" />
    <text x="81" y="290" class="chip">IN PROGRESS</text>
    <path d="M164 279h16v16h-16zM164 284h16M168 276v6M176 276v6" fill="none" stroke="#526966" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="188" y="291" class="secondary" font-size="11.5">8 Aug 2026</text>
    <rect x="276" y="269" width="101" height="36" rx="9" fill="#FFFFFF" stroke="#16679A" />
    <text x="326.5" y="292" fill="#16679A" font-size="10.5" font-weight="700" text-anchor="middle">Finish workout</text>

    <!-- Group label -->
    <rect x="44" y="334" width="106" height="25" rx="12.5" fill="#1D4E89" />
    <text x="97" y="351" fill="#FFFFFF" font-size="9.5" font-weight="750" letter-spacing=".8" text-anchor="middle">STRAIGHT SET</text>
    <line x1="158" y1="346.5" x2="386" y2="346.5" stroke="#3FC1C0" stroke-width="2" stroke-linecap="round" />

    <!-- Exercise and execution -->
    <g transform="translate(44 375)">
      <rect width="342" height="393" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
      <text x="18" y="31" class="heading" font-size="18">Goblet squat</text>
      <rect x="285" y="12" width="40" height="40" rx="10" fill="#FFFFFF" stroke="#C9E2E5" />
      <path d="M299 36l12-12m-7 0h7v7M309 35v5h-13V27h5" fill="none" stroke="#16679A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />

      <text x="18" y="59" class="secondary" font-size="11">3 sets · 10–12 reps · 20–25 kg · RIR 3</text>
      <rect x="18" y="72" width="92" height="24" rx="12" fill="#DFF4F4" />
      <text x="64" y="88" class="chip" text-anchor="middle">TEMPO 3–1–1</text>
      <text x="120" y="88" fill="#16679A" font-size="10.5" font-weight="700">Cues</text>
      <path d="m153 82 5 5 5-5" fill="none" stroke="#16679A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

      <line x1="18" y1="112" x2="324" y2="112" stroke="#E2EEF0" />
      <circle cx="35" cy="143" r="17" fill="#DFF4F4" />
      <text x="35" y="148" class="heading" font-size="13" text-anchor="middle">1</text>
      <text x="64" y="139" class="body" font-size="14" font-weight="700">11 reps</text>
      <text x="64" y="158" class="secondary" font-size="11.5">22.5 kg · RIR 2</text>
      <rect x="284" y="121" width="40" height="44" rx="10" fill="#FFFFFF" stroke="#C9E2E5" />
      <path d="m297 151 2-7 10-10 5 5-10 10-7 2Zm10-14 5 5" fill="none" stroke="#16679A" stroke-width="1.6" stroke-linejoin="round" />

      <line x1="18" y1="180" x2="324" y2="180" stroke="#E2EEF0" />
      <text x="18" y="205" class="heading" font-size="14">Set 2</text>
      <text x="324" y="205" class="secondary" font-size="10" text-anchor="end">empty until you log it</text>

      <text x="18" y="226" class="eyebrow">REPS</text>
      <text x="108" y="226" class="eyebrow">LOAD KG</text>
      <text x="198" y="226" class="eyebrow">RIR</text>
      <rect x="18" y="234" width="78" height="48" rx="9" fill="#FFFFFF" stroke="#C9E2E5" />
      <rect x="108" y="234" width="78" height="48" rx="9" fill="#FFFFFF" stroke="#C9E2E5" />
      <rect x="198" y="234" width="62" height="48" rx="9" fill="#FFFFFF" stroke="#C9E2E5" />
      <line x1="32" y1="272" x2="82" y2="272" stroke="#E2EEF0" />
      <line x1="122" y1="272" x2="172" y2="272" stroke="#E2EEF0" />
      <line x1="212" y1="272" x2="246" y2="272" stroke="#E2EEF0" />
      <rect x="270" y="234" width="54" height="48" rx="9" fill="#16679A" />
      <text x="297" y="264" fill="#FFFFFF" font-size="12" font-weight="720" text-anchor="middle">Log</text>

      <rect x="18" y="300" width="306" height="44" rx="9" fill="#F4FAFB" stroke="#C9E2E5" />
      <path d="M35 317v12m-6-6h12" fill="none" stroke="#16679A" stroke-width="1.8" stroke-linecap="round" />
      <text x="52" y="327" class="secondary" font-size="11.5">A new blank editor appears after logging</text>
      <text x="324" y="374" class="secondary" font-size="10" text-anchor="end">Set notes available in edit</text>
    </g>

    <!-- Next exercise peeks above the fixed dock to communicate scrolling -->
    <rect x="44" y="789" width="342" height="92" rx="12" fill="#FFFFFF" stroke="#C9E2E5" />
    <text x="62" y="819" class="heading" font-size="17">Single-arm cable row</text>
    <text x="62" y="842" class="secondary" font-size="11">3 each · 12 reps / side · RIR 3</text>

    <!-- Fixed navigation dock -->
    <rect x="28" y="850" width="374" height="72" fill="#F4FAFB" fill-opacity=".98" />
    <line x1="28" y1="850" x2="402" y2="850" stroke="#D9E9EB" />
    <circle cx="215" cy="886" r="28" fill="#16679A" filter="url(#control-shadow)" />
    <rect x="202" y="873" width="10" height="10" rx="2.5" fill="#3FC1C0" />
    <rect x="218" y="873" width="10" height="10" rx="2.5" fill="#FFFFFF" />
    <rect x="202" y="889" width="10" height="10" rx="2.5" fill="#FFFFFF" />
    <rect x="218" y="889" width="10" height="10" rx="2.5" fill="#3FC1C0" />
    <rect x="159" y="905" width="112" height="5" rx="2.5" fill="#1D4E89" fill-opacity=".72" />
  </g>

  <rect x="166" y="27" width="98" height="24" rx="12" fill="#1D4E89" />
</svg>
